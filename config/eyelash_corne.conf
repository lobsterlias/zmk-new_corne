# --- Power / sleep ---
# Deep sleep after 1 hour without typing (the keyboard maker's own setting).
# Sleep used to be disabled, so both halves kept their radios running 24/7,
# even with the laptop closed, which drains the batteries fast. A low battery
# makes the Bluetooth link unstable, which shows up as stutter and lag.
# After an hour asleep, the first keypress wakes the board and is not typed.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_KEYBOARD_NAME="lias Corne"

# --- Bluetooth ---
# Max radio power for a stronger link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# On ZMK 0.3 this only switches the radio from the 2M PHY to the 1M PHY.
# 1M is more robust and has better range, and a keyboard never needs the
# extra bandwidth of 2M. It fixes stutter with many Windows Bluetooth adapters.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Connection interval is left at ZMK defaults on purpose. Forcing it is what
# caused the freeze + "ssssss" key-repeat spam back in September.

# --- Key scanning ---
# ZMK's real default is 5 ms press / 5 ms release. The 1 ms press value used
# before was more aggressive than default, and the keyboard maker warns that
# their switches need longer debounce or chatter turns into doubled letters.
# 5 ms is far below what you can feel; the Bluetooth link alone is 7.5-15 ms.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --- HID ---
# NKRO works fine on most hosts. If key-repeat spam ever comes back, set this
# to n as a test; some Bluetooth stacks handle 6KRO reports more reliably.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
# Some operating systems have problems with full support for consumer keycodes.
# Uncomment the following line if keycodes labeled "consumer" like C_AC_SEARCH don't work
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# --- RGB underglow ---
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# --- Backlight ---
# Was 100% brightness with no idle timeout and no key to turn it off, so it
# ran at full power all day. Now 40%, switches off after 30 s idle and comes
# back on the next keypress. Toggle / cycle brightness on the NUMBER layer
# (hold the left thumb key, then C to toggle, V to cycle brightness).
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=40
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# --- Encoder ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- Pointing / mouse ---
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
