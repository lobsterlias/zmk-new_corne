# --- Power / sleep ---
# Deep sleep disabled; idle (screen/LED off) after 30s, which is ZMK's default.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_EXT_POWER=y

# --- Bluetooth ---
# Max radio power for a stronger, more stable link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Connection interval / profile counts are deliberately left at ZMK defaults.
# Forcing a fixed 7.5 ms interval and disabling connection-parameter updates
# (the previous "MAXIMUM PERFORMANCE" block) caused the freeze + key-repeat spam.
#
# If you are on Windows and still see occasional stalls, uncomment this line:
#CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# --- Key scanning ---
# ZMK defaults: 1 ms press / 5 ms release. The previous 8/8 added latency.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --- HID ---
# NKRO works fine on most hosts. If the spam ever comes back, set this to n
# as a test — some Bluetooth stacks handle 6KRO reports more reliably.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
# Some operating systems have problems with full support for consumer keycodes.
# Uncomment the following line if keycodes labeled "consumer" like C_AC_SEARCH don't work
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# --- RGB underglow ---
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# --- Backlight ---
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100

# --- Encoder ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- Pointing / mouse ---
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
